[project]
name = "callmemaybe"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "llm-sdk",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
exclude = ['^\.venv/', '^llm_sdk/', '^scratch/']
# Find the real package (llm_sdk/llm_sdk), not the workspace folder.
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
# Use the bundled SDK's types without checking its implementation.
follow_imports = "silent"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.pytest.ini_options]
# Run from the project root so tests can `import src...`.
pythonpath = ["."]
testpaths = ["tests"]
